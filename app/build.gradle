plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ninoh.aiagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ninoh.aiagent'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    packaging { jniLibs { useLegacyPackaging = true } }
}
